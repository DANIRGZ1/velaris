<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Velaris — League of Legends companion. Real-time stats, AI Coach, build recommendations and LP tracking." />
    <meta name="theme-color" content="#111113" />
    <title>Velaris</title>

    <!--
      Synchronous CSS applied before the first browser paint.
      The window is non-transparent (transparent:false in tauri.conf.json),
      so the body and root stay dark at all times — no transparent-corner tricks.
      Rounded corners are handled by DWM (DWMWCP_ROUND) at the OS level.
    -->
    <style>
      html  { margin: 0; padding: 0; background: #111113; }
      body  { margin: 0; padding: 0; background: #111113; }
      #root { min-height: 100vh; background: #111113; overflow: hidden; }

      @keyframes velaris-shimmer {
        0%   { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      @keyframes shimmer-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
    </style>

    <script>
      /* Apply saved dark/light class before next-themes hydrates */
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark  = saved === 'dark'
            || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
            || saved === null;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
